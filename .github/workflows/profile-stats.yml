name: Atualizar perfil
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-github-stats.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Salvar métricas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/profile/github-stats.json assets/profile/contributions.json assets/modern-profile-dark.svg assets/modern-profile-light.svg assets/live-*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: atualizar métricas do perfil'
            git push
          fi
